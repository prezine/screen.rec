appId: io.pandascrow.toom
productName: Toom
# toom:// links (magic sign-in links, return from checkout)
protocols:
  - name: Toom
    schemes: [toom]
# Releases: GitHub Actions (.github/workflows/release.yml) builds every installer and uploads it
# to a GitHub release; installed apps update from the same release (electron-updater reads
# latest-mac.yml / latest.yml there). The repo must be public for downloads and updates. To keep
# the code private, publish to a separate public repo (RELEASE_REPO, see the workflow).
publish:
  provider: github
  owner: prezine
  repo: toom-software
  releaseType: draft
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - '!out/**/*.map'
  - package.json
# smaller download: best compression, and only English Chromium resources (~40 MB less)
compression: maximum
electronLanguages: [en, en-US, en-GB, en_GB]
# Electron fuses: switch off ways to run the app's binary as a plain Node.js or debug it
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
asarUnpack:
  - node_modules/uiohook-napi/**
  - node_modules/electron-liquid-glass/**
mac:
  icon: build/icon.png
  category: public.app-category.video
  target:
    # zip is what auto-update downloads on macOS
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Toom uses your camera to record a webcam overlay.
    NSMicrophoneUsageDescription: Toom uses your microphone to record narration.
    NSScreenCaptureUsageDescription: Toom records your screen.
win:
  # full-bleed artwork for Windows (macOS uses build/icon.png on Apple's icon grid)
  icon: build/icon-win.png
  target:
    # one installer for both: it installs the x64 or Arm build to match the PC, and auto-update
    # (one latest.yml per release) then works for both
    - target: nsis
      arch: [x64, arm64]
# Installers get version-free names so the website can link to
# https://github.com/prezine/toom-software/releases/latest/download/<name> and always get the newest.
dmg:
  artifactName: Toom-${arch}.${ext}
nsis:
  artifactName: Toom-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
extraResources:
  - from: resources
    to: resources
  # on-device text recognition for auto privacy masks
  - from: node_modules/tesseract.js/dist/worker.min.js
    to: ocr/worker.min.js
  - from: node_modules/tesseract.js-core/tesseract-core-simd-lstm.wasm.js
    to: ocr/tesseract-core-simd-lstm.wasm.js
  - from: node_modules/@tesseract.js-data/eng/4.0.0_best_int/eng.traineddata.gz
    to: ocr/eng.traineddata.gz
